name: Emma E2E 23x

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Wait for GitHub Pages deployment
        run: |
          for i in $(seq 1 36); do
            if curl -fsS "https://astraoilandgas2026.github.io/AOG-Jarvis/?e2e=1" | grep -q "app.js?v=21"; then
              echo "Pages deployment v21 detected"
              exit 0
            fi
            echo "Waiting for Pages deployment v21... attempt $i/36"
            sleep 10
          done
          echo "Pages deployment v21 not detected"
          exit 1
      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Emma 23x browser verification
        id: e2e
        run: |
          set -o pipefail
          npx playwright test tests/emma-e2e.spec.js --reporter=line 2>&1 | tee e2e.log
      - name: Report result to issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "${{ steps.e2e.outcome }}" = "success" ]; then
            printf '## Emma E2E 23x — PASS\n\n' > result.md
          else
            printf '## Emma E2E 23x — FAIL\n\n' > result.md
          fi
          cat e2e.log >> result.md
          gh issue comment "$ISSUE_NUMBER" --body-file result.md
