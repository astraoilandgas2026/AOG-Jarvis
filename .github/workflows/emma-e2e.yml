name: Emma E2E 23x

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Serve current Emma checkout
        run: nohup python3 -m http.server 5500 --directory app >/tmp/emma-http.log 2>&1 &
      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Emma 30x browser verification
        id: e2e
        env:
          EMMA_TEST_URL: http://127.0.0.1:5500/?e2e=1
        run: npx playwright test tests/emma-e2e.spec.js --reporter=line 2>&1 | tee e2e.log
      - name: Report result to issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "${{ steps.e2e.outcome }}" = "success" ]; then
            printf '## Emma E2E 23x — PASS\n\n' > result.md
          else
            printf '## Emma E2E 23x — FAIL\n\n' > result.md
          fi
          cat e2e.log >> result.md
          gh issue comment "$ISSUE_NUMBER" --body-file result.md
