name: Supplier Intelligence Verify

on:
  push:
    branches: ["feat/supplier-intelligence"]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check changed JavaScript
        run: |
          node --check app/app.js
          node --check app/modules/supplier-intelligence.js
